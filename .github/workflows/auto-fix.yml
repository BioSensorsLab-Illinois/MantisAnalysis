name: auto-fix

# Fires when `smoke` or `release` fail. Two modes:
#
#   FIRST-ATTEMPT — failing branch is anything OTHER than `auto-fix/*`.
#     Runs deterministic auto-fixes (ruff --fix, ruff format) + optional
#     Claude Code agentic fix loop + verification. On success, opens a
#     fresh `auto-fix/<workflow>-<run-id>` PR. On no-fix-possible, opens
#     a deduped Issue.
#
#   CONTINUATION — failing branch is already `auto-fix/*` (i.e. the
#     prior auto-fix PR's CI just failed). Pushes ANOTHER commit to
#     the existing branch with a refined patch. Claude sees a summary
#     of prior attempts so it doesn't repeat broken patches. Iterates
#     up to MAX_ITERATIONS commits per PR. On exhaustion, comments on
#     the PR + adds an `autofix-exhausted` label; PR stays open for
#     human takeover.
#
# Safe-by-default: never force-pushes, always opens a PR for review,
# and is gated to the repo's own branches (skips forks).
#
# Activation (one-time, gh CLI):
#   gh secret set ANTHROPIC_API_KEY --body "$ANTHROPIC_API_KEY"
#   gh api -X PUT /repos/$OWNER/$REPO/actions/permissions/workflow \
#       -F can_approve_pull_request_reviews=true
#
# Design + decision log: .agent/runs/ci-autofix-iteration-loop/

on:
  workflow_run:
    workflows: [smoke, release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "workflow run ID to react to"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  MAX_ITERATIONS: "10"

jobs:
  diagnose-and-fix:
    # Only run on real failures, not cancellations, and not for PRs from forks
    # (fork PRs can't receive a push from this workflow).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest

    env:
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name || 'manual' }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      FAILED_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAILED_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Download failing workflow logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .auto-fix
          gh run view "$FAILED_RUN_ID" --log-failed > .auto-fix/failure.log 2>&1 || true
          tail -n 400 .auto-fix/failure.log > .auto-fix/failure.tail.log || true
          wc -l .auto-fix/failure.log || true

      - name: Determine mode (first-attempt vs continuation)
        id: mode
        run: |
          set -euo pipefail
          if [[ "${FAILED_BRANCH:-}" == auto-fix/* ]]; then
            echo "mode=continue" >> "$GITHUB_OUTPUT"
            echo "branch=$FAILED_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::notice::Continuation mode on branch $FAILED_BRANCH"
          else
            echo "mode=first" >> "$GITHUB_OUTPUT"
            echo "branch=auto-fix/${FAILED_WORKFLOW}-${FAILED_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "::notice::First-attempt mode → new branch auto-fix/${FAILED_WORKFLOW}-${FAILED_RUN_ID}"
          fi

      - name: Iteration check (continuation only — count claude-autofix commits)
        id: iter-check
        if: steps.mode.outputs.mode == 'continue'
        run: |
          set -euo pipefail
          # Find the base branch for divergence counting. Try main, then master.
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin master:refs/remotes/origin/master 2>/dev/null \
            || true
          BASE=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/@@' || echo "origin/main")
          count=$(git log "$BASE..HEAD" --author='claude-autofix' --oneline | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::notice::Iteration count on $FAILED_BRANCH: $count / $MAX_ITERATIONS"
          if [ "$count" -ge "$MAX_ITERATIONS" ]; then
            echo "max_reached=true"  >> "$GITHUB_OUTPUT"
          else
            echo "max_reached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment + label PR (max iterations exhausted)
        if: |
          steps.mode.outputs.mode == 'continue' &&
          steps.iter-check.outputs.max_reached == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mode.outputs.branch }}
          ITER_COUNT: ${{ steps.iter-check.outputs.count }}
        run: |
          set -euo pipefail
          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -z "$PR_NUM" ]; then
            echo "::warning::No open PR found for $BRANCH; cannot post exhaustion comment."
            exit 0
          fi
          gh label create autofix-exhausted \
            --description "Autofix loop hit the iteration cap; needs human" \
            --color B60205 2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label autofix-exhausted || true
          gh pr comment "$PR_NUM" --body "$(cat <<EOF
          :x: **Autofix iteration cap reached** ($ITER_COUNT / $MAX_ITERATIONS commits, CI still failing).

          Latest failed run: https://github.com/${{ github.repository }}/actions/runs/$FAILED_RUN_ID

          Claude could not converge on a passing patch within the cap. Manual intervention needed.
          EOF
          )"

      - name: Build prior-attempts summary (continuation only)
        id: prior
        if: |
          steps.mode.outputs.mode == 'continue' &&
          steps.iter-check.outputs.max_reached != 'true'
        run: |
          set -euo pipefail
          BASE=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/@@' || echo "origin/main")
          {
            echo "Prior autofix attempts on this branch (most recent last):"
            echo
            git log "$BASE..HEAD" --author='claude-autofix' \
              --pretty=format:'--- attempt %h (%ci) ---%n%s%n%n%b%n' \
              --reverse
          } > .auto-fix/prior_attempts.txt
          head -100 .auto-fix/prior_attempts.txt
          echo "path=.auto-fix/prior_attempts.txt" >> "$GITHUB_OUTPUT"

      - name: Run deterministic auto-fixes (ruff)
        id: ruff
        if: steps.mode.outputs.mode == 'first' || steps.iter-check.outputs.max_reached != 'true'
        continue-on-error: true
        run: |
          python -m ruff check --fix --unsafe-fixes . || true
          python -m ruff format . || true
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Anthropic secret
        id: probe
        if: steps.mode.outputs.mode == 'first' || steps.iter-check.outputs.max_reached != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Invoke Claude Code for smarter fix (if configured)
        id: claude
        if: |
          steps.probe.outputs.available == 'true' &&
          (steps.mode.outputs.mode == 'first' || steps.iter-check.outputs.max_reached != 'true')
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pip install "anthropic>=0.34"
          PRIOR_ARG=()
          if [ -n "${{ steps.prior.outputs.path }}" ] && [ -f "${{ steps.prior.outputs.path }}" ]; then
            PRIOR_ARG=(--prior-attempts "${{ steps.prior.outputs.path }}")
          fi
          python .github/auto-fix/claude_fix.py \
              --log .auto-fix/failure.tail.log \
              --workflow "$FAILED_WORKFLOW" \
              --branch "$FAILED_BRANCH" \
              --commit "$FAILED_SHA" \
              "${PRIOR_ARG[@]}"

      - name: Re-run smoke tier 1 after fixes
        id: verify
        if: steps.mode.outputs.mode == 'first' || steps.iter-check.outputs.max_reached != 'true'
        continue-on-error: true
        run: |
          python scripts/smoke_test.py --tier 1
          python -m pytest tests/unit -q

      - name: Detect any changes produced
        id: diff
        if: steps.mode.outputs.mode == 'first' || steps.iter-check.outputs.max_reached != 'true'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity (autofix bot)
        if: |
          steps.diff.outputs.changed == 'true' &&
          steps.verify.outcome == 'success' &&
          (steps.mode.outputs.mode == 'first' || steps.iter-check.outputs.max_reached != 'true')
        run: |
          git config user.name "claude-autofix[bot]"
          git config user.email "claude-autofix-bot@users.noreply.github.com"

      - name: Open auto-fix PR (first-attempt mode only)
        if: |
          steps.mode.outputs.mode == 'first' &&
          steps.diff.outputs.changed == 'true' &&
          steps.verify.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-fix/${{ env.FAILED_WORKFLOW }}-${{ env.FAILED_RUN_ID }}
          base: ${{ env.FAILED_BRANCH }}
          author: "claude-autofix[bot] <claude-autofix-bot@users.noreply.github.com>"
          committer: "claude-autofix[bot] <claude-autofix-bot@users.noreply.github.com>"
          title: "auto-fix: ${{ env.FAILED_WORKFLOW }} failure on ${{ env.FAILED_BRANCH }}"
          commit-message: |
            auto-fix: repair ${{ env.FAILED_WORKFLOW }} failures

            Run: ${{ env.FAILED_RUN_ID }}
            Commit: ${{ env.FAILED_SHA }}
          body: |
            Automated attempt to fix the failing **${{ env.FAILED_WORKFLOW }}** workflow.

            - Failed run: https://github.com/${{ github.repository }}/actions/runs/${{ env.FAILED_RUN_ID }}
            - Head commit: `${{ env.FAILED_SHA }}`
            - Branch: `${{ env.FAILED_BRANCH }}`

            ### Fixes applied
            - `ruff check --fix --unsafe-fixes`
            - `ruff format`
            ${{ steps.claude.outcome == 'success' && '- Claude Code touch-up pass' || '' }}

            ### Verification
            - `scripts/smoke_test.py --tier 1` → passed
            - `pytest tests/unit` → passed

            ### Iteration loop
            If this PR's own CI fails on the next run, the auto-fix workflow
            will push another commit to this same branch with a refined
            patch (up to **${{ env.MAX_ITERATIONS }}** total iterations).
            On exhaustion: comment + `autofix-exhausted` label.

            Review carefully before merging — automated fixes are a starting
            point, not a guarantee of correctness.
          labels: |
            auto-fix
            ci

      - name: Push iteration commit to existing PR (continuation mode)
        if: |
          steps.mode.outputs.mode == 'continue' &&
          steps.iter-check.outputs.max_reached != 'true' &&
          steps.diff.outputs.changed == 'true' &&
          steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mode.outputs.branch }}
          ITER_PRIOR: ${{ steps.iter-check.outputs.count }}
        run: |
          set -euo pipefail
          ITER_NEXT=$((ITER_PRIOR + 1))
          git add -A
          if git diff --cached --quiet; then
            echo "::warning::No staged changes after add -A; ending loop."
            exit 0
          fi
          git commit -m "[auto-fix] iteration $ITER_NEXT/$MAX_ITERATIONS — retry after $FAILED_WORKFLOW failure

          Failed run: https://github.com/${{ github.repository }}/actions/runs/$FAILED_RUN_ID
          Head SHA before retry: $FAILED_SHA

          Generated by Claude via .github/auto-fix/claude_fix.py.
          Prior-attempts summary fed into the prompt to avoid repeated patches."
          git push origin "HEAD:$BRANCH"
          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --body "$(cat <<EOF
          :arrows_counterclockwise: **Auto-fix iteration $ITER_NEXT/$MAX_ITERATIONS** pushed.

          Triggered by failed $FAILED_WORKFLOW run: https://github.com/${{ github.repository }}/actions/runs/$FAILED_RUN_ID

          Smoke tier 1 + pytest unit both passed locally before pushing.
          The PR's own CI will re-validate the full matrix. If it fails
          again, the loop continues — up to $MAX_ITERATIONS commits total.
          EOF
          )"
          fi

      - name: Open issue if no fix was possible (first-attempt mode only)
        if: |
          steps.mode.outputs.mode == 'first' &&
          (steps.diff.outputs.changed == 'false' || steps.verify.outcome != 'success')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let tail = '';
            try { tail = fs.readFileSync('.auto-fix/failure.tail.log', 'utf8'); } catch (_) {}
            const title = `CI failure on ${process.env.FAILED_BRANCH}: ${process.env.FAILED_WORKFLOW}`;
            const body = [
              `The **${process.env.FAILED_WORKFLOW}** workflow failed and the auto-fix bot couldn't repair it.`,
              '',
              `- Failed run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.FAILED_RUN_ID}`,
              `- Head commit: \`${process.env.FAILED_SHA}\``,
              `- Branch: \`${process.env.FAILED_BRANCH}\``,
              '',
              '### Failure tail',
              '```',
              tail.slice(-12000),
              '```',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-fix',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['auto-fix', 'ci'],
              });
            }
